<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="description" content="Showerhacks — a 12-hour hackathon in San Francisco where the winner gets to take a shower.">
  <meta name="keywords" content="SF Hackathon, shower hacks, showerhacks">
  <meta property="og:title" content="Showerhacks — a 12-hour hackathon where the winner gets to take a shower">
  <meta property="og:description" content="Showerhacks is a 12-hour hackathon in SF where the winner gets to take a shower">
  <meta property="og:image" content="https://showerhacks.org/whitelogo.png">
  <meta property="og:url" content="https://showerhacks.org/">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single:wght@400;700&family=Bitcount:wght@400;700&family=Montserrat:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single:wght@400;700&family=Bitcount:wght@400;700&family=Montserrat:wght@400;500;600;700&display=swap"></noscript>

  <style>
    /* ---------- Design tokens ---------- */
    :root {
      --brand:        #007bff;
      --brand-soft:   #e6f1ff;
      --accent:       lightcoral;
      --ink:          #2a2a33;
      --ink-soft:     #5a5a66;

      --surface:      rgba(255, 255, 255, 0.82);
      --surface-strong: rgba(255, 255, 255, 0.9);
      --border:       rgba(255, 255, 255, 0.55);

      --glow:         0 0 18px rgba(255,255,255,0.9);

      --space-2: 12px;
      --space-3: 18px;
      --space-4: 28px;
      --space-5: 44px;
      --space-6: 72px;

      --font-display: "Bitcount", system-ui;
      --font-body:    "Bitcount Prop Single", system-ui;
      --font-ui:      "Montserrat", system-ui, sans-serif;
    }

    /* ---------- Base ---------- */
    *, *::before, *::after { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: var(--font-body);
      color: var(--ink);
      background: linear-gradient(180deg, #cce6ff 0%, #e1d8e1 100%);
      text-align: center;
      padding: clamp(20px, 4vw, 48px) clamp(16px, 4vw, 40px) var(--space-6);
      position: relative;
      z-index: 0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url("tile.jpg") repeat;
      background-size: 220px 220px;
      opacity: 0.18;
      z-index: -2;
      pointer-events: none;
    }

    a { color: var(--brand); text-decoration: none; }
    a:hover { text-decoration: underline; }

    b, strong {
      font-weight: 700;
      -webkit-text-stroke: 0.4px currentColor;
    }

    /* ---------- Layout ---------- */
    main {
      max-width: 1080px;
      margin: 0 auto;
    }

    /* ---------- Header / Hero ---------- */
    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 2vw, 18px);
      flex-wrap: wrap;
      margin-top: clamp(72px, 14vh, 140px);
      padding-top: 44px;
    }
    .header img {
      height: clamp(120px, 22vw, 160px);
      width: auto;
      filter: drop-shadow(0 0 18px rgba(255,255,255,0.95));
    }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(2.4rem, 9vw, 4.2rem);
      margin: 0;
      letter-spacing: 1px;
      text-shadow: var(--glow);
      white-space: nowrap;
    }

    .tagline {
      font-size: clamp(1.05rem, 2.6vw, 1.45rem);
      margin: var(--space-3) auto var(--space-4);
      max-width: 640px;
      text-shadow: var(--glow);
      line-height: 1.45;
    }

    /* CTA buttons */
    .buttons {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 0 auto var(--space-5);
      flex-wrap: wrap;
    }
    .buttons a {
      font-family: var(--font-ui);
      padding: 13px 24px;
      font-size: 0.98rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      border-radius: 999px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: transform .15s ease, box-shadow .2s ease, background-color .2s ease;
    }
    .buttons a.waitlist {
      color: white;
      background-color: var(--brand);
      box-shadow: 0 8px 22px rgba(0,123,255,0.35);
    }
    .buttons a.waitlist:hover { transform: translateY(-1px); text-decoration: none; }
    .buttons a.discord {
      background-color: var(--brand-soft);
      color: var(--brand);
      border: 2px solid var(--brand);
    }
    .buttons a.discord:hover { background: white; text-decoration: none; }

    /* ---------- Footer ---------- */
    .site-footer {
      margin-top: var(--space-6);
      padding: var(--space-4) 0;
      font-family: var(--font-ui);
      font-size: 0.92rem;
      color: var(--ink-soft);
      text-align: center;
      line-height: 1.7;
    }
    .site-footer .sep { opacity: 0.45; margin: 0 8px; }

    /* ---------- Chrome-only stroke trick ---------- */
    @supports (-webkit-appearance:none) and (not (-webkit-touch-callout:none)) and (not (selector(:-moz-placeholder))) {
      h1 { -webkit-text-stroke: 3px currentColor; }
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 600px) {
      body::before { background-size: calc(100vw / 3) auto; }
      .header img { height: clamp(96px, 22vw, 120px); }
      h1 { font-size: clamp(2rem, 11vw, 3rem); }
    }
  </style>
</head>

<body>

    <img src="logo.webp" alt="Showerhacks logo" width="320" height="320" decoding="async">
    <h1>Showerhacks</h1>
  </div>

  <p class="tagline">
    A 12-hour hackathon where the <b>winner gets to take a shower</b>.
  </p>

  <div class="buttons">
    <a href="https://forms.gle/rPKcjdARZ2QAKaZ17" class="waitlist" target="_blank" rel="noopener noreferrer">Future Interest Form</a>
    <a href="2026.html" class="discord">2026 Page</a>
    <a href="https://showerhacks.devpost.com/project-gallery" class="discord" target="_blank" rel="noopener noreferrer">2026 Projects</a>
    <a href="https://discord.gg/4xEtJc9xqZ" class="discord">
      <img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/discord.svg" width="20" height="20" alt="" decoding="async">
      Join Discord
    </a>
  </div>

  <main>

    <!-- ============ FOOTER ============ -->
    <footer class="site-footer">
      Follow us on Instagram <a href="https://instagram.com/showerhacks">@showerhacks</a>
      and on <a href="https://www.linkedin.com/company/showerhacks">LinkedIn</a>.
      <br/>
      <a href="https://showerhacks.org/tos.txt">ToS</a><span class="sep">·</span>
      <a href="https://showerhacks.org/privacy.txt">Privacy</a><span class="sep">·</span>
      <a href="https://showerhacks.org/coc.html">Code of Conduct</a>
      <br/>
      <a href="https://linsnexus.com">Sponsorship agency</a>
    </footer>

  </main>

  <!-- ============ Binary rain (1s and 0s bouncing off the page) ============ -->
  <script type="module">
    import { prepareWithSegments, measureNaturalWidth } from 'https://cdn.jsdelivr.net/npm/@chenglou/pretext@0.0.8/dist/layout.js';

    const canvas = document.createElement('canvas');
    Object.assign(canvas.style, {
      position: 'fixed', top: '0', left: '0', width: '100%', height: '100%',
      pointerEvents: 'none', zIndex: '-1',
    });
    document.body.appendChild(canvas);
    const ctx = canvas.getContext('2d');

    const FONT_STACK = 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
    const BASE_SIZE = 16;

    // Pretext measures each glyph once (canvas-backed, no DOM reflow).
    const zeroWidth = measureNaturalWidth(prepareWithSegments('0', `${BASE_SIZE}px ${FONT_STACK}`));
    const oneWidth = measureNaturalWidth(prepareWithSegments('1', `${BASE_SIZE}px ${FONT_STACK}`));

    const GRAVITY = 900;
    const MAX_FALL = 360;
    const RESTITUTION = 0.55;
    const SPAWN_MS = 70;

    const SOLID_SELECTOR = '.card, .team-member, .sponsor-card, .itinerary-item, .faq details, .afterparty-container, .hero, .header h1, .header img';

    let width, height;
    let scrollY = 0;
    const solids = [];   // page-space {left, right, top}

    function measureSolids() {
      const sy = window.scrollY;
      solids.length = 0;
      document.querySelectorAll(SOLID_SELECTOR).forEach((el) => {
        const r = el.getBoundingClientRect();
        solids.push({ left: r.left, right: r.right, top: r.top + sy });
      });
    }

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      measureSolids();
    }
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('load', measureSolids);
    document.addEventListener('toggle', measureSolids);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(measureSolids);

    class Bit {
      constructor() { this.state = 'idle'; }
      spawn() {
        this.state = 'fall';
        this.x = Math.random() * width;
        this.y = -24;
        this.vx = (Math.random() - 0.5) * 30;
        this.vy = 80 + Math.random() * 120;
        this.size = 13 + Math.random() * 8;
        this.opacity = 0.10 + Math.random() * 0.22;
        this.digit = Math.random() < 0.5 ? '0' : '1';
        this.w = (this.digit === '0' ? zeroWidth : oneWidth) * (this.size / BASE_SIZE);
      }
      step(dt) {
        this.vy = Math.min(this.vy + GRAVITY * dt, MAX_FALL);
        const prevY = this.y;
        this.x += this.vx * dt;
        this.y += this.vy * dt;

        for (const s of solids) {
          const top = s.top - scrollY;
          if (this.vy > 0 && this.x >= s.left && this.x <= s.right && prevY < top && this.y >= top) {
            this.y = top;
            this.vy = -this.vy * RESTITUTION;
            this.vx += (Math.random() - 0.5) * 24;
            break;
          }
        }

        if (this.y > height + 40) this.state = 'idle';
      }
      draw() {
        ctx.font = `${this.size}px ${FONT_STACK}`;
        ctx.fillStyle = `rgba(42, 42, 51, ${this.opacity})`;
        ctx.fillText(this.digit, this.x - this.w / 2, this.y);
      }
    }

    const idle = [];
    const active = [];
    for (let i = 0; i < 80; i++) idle.push(new Bit());

    function spawnOne() {
      if (idle.length === 0) return;
      const b = idle.pop();
      b.spawn();
      active.push(b);
    }

    let emitter = 0;

    resizeCanvas();

    let last = 0;
    function animate(ts) {
      requestAnimationFrame(animate);
      if (ts - last < 1000 / 30) return;
      const dt = (ts - last) / 1000;
      last = ts;

      scrollY = window.scrollY;

      emitter -= dt * 1000;
      if (emitter <= 0) { emitter = SPAWN_MS; spawnOne(); }

      ctx.clearRect(0, 0, width, height);
      for (let i = active.length - 1; i >= 0; i--) {
        const b = active[i];
        b.step(dt);
        if (b.state === 'idle') { active.splice(i, 1); idle.push(b); }
        else b.draw();
      }
    }
    requestAnimationFrame(animate);
  </script>

  <!-- ============ Pulsing Interest Form button ============ -->
  <script>
    const applyButton = document.querySelector(".buttons a.waitlist");
    if (applyButton) {
      applyButton.animate(
        [
          { transform: "scale(1)",    boxShadow: "0 8px 22px rgba(0, 123, 255, 0.35)" },
          { transform: "scale(1.06)", boxShadow: "0 0 28px rgba(0, 123, 255, 0.75)" },
          { transform: "scale(1)",    boxShadow: "0 8px 22px rgba(0, 123, 255, 0.35)" }
        ],
        { duration: 1600, iterations: Infinity, easing: "ease-in-out" }
      );
    }
  </script>

</body>
</html>
